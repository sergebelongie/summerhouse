<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyvelbakken 10 - 3D Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 20px;
            border-radius: 10px; text-align: center; cursor: pointer; z-index: 10;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background-color: rgba(255, 255, 255, 0.5); border: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            display: none; z-index: 5;
        }
    </style>
</head>
<body>
    <div id="instructions">
    <p style="font-size:36px; margin-bottom: 20px;">
        Click to play
    </p>
    <p style="font-size:18px; line-height: 1.8;">
        <b>Move:</b> WASD or Arrow Keys<br/>
        <b>Fly:</b> Double-tap Space<br/>
        <b>Up/Down (Flying):</b> Space / Shift<br/>
        <b>Toggle Room/Wall Labels:</b> L<br/>
        <b>Toggle Furniture Labels:</b> K<br/>
        <b>Toggle Furnishings:</b> F<br/>
        <b>Toggle Ceilings/Roofs:</b> C<br/>
        <b>Toggle Illumination:</b> I
    </p>
</div>
    <div id="crosshair"></div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
