<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyvelbakken 10 - Digital Twin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 300px;
            pointer-events: auto;
            z-index: 10;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: #4b5563;
            z-index: 20;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        #photo-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            display: none;
            z-index: 30;
            pointer-events: auto;
        }
        #photo-overlay img {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
        }
        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #6b7280;
            font-size: 1.2rem;
        }
    </style>
    <!-- Import Three.js and OrbitControls via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-panel">
        <h1 class="text-xl font-bold text-gray-800 mb-2">Gyvelbakken 10</h1>
        <p class="text-sm text-gray-600 mb-4">Interactive Digital Twin</p>
        <div class="text-xs text-gray-500 space-y-2">
            <p><strong>Controls:</strong></p>
            <ul class="list-disc pl-4">
                <li>Left Click + Drag to Rotate</li>
                <li>Right Click + Drag to Pan</li>
                <li>Scroll to Zoom</li>
                <li>Click 📷 to view photos</li>
            </ul>
        </div>
        <div class="mt-4 pt-4 border-t border-gray-200">
            <p class="text-xs font-semibold text-gray-700">Data Loaded:</p>
            <p class="text-xs text-gray-500" id="data-stats">Awaiting data...</p>
        </div>
    </div>

    <!-- Photo Display Overlay -->
    <div id="photo-overlay">
        <span class="close-btn" onclick="document.getElementById('photo-overlay').style.display='none'">×</span>
        <h3 id="photo-title" class="text-sm font-bold mb-2 text-gray-800">Room Photo</h3>
        <!-- Added an onerror fallback to show a placeholder if the local asset isn't found -->
        <img id="photo-img" src="" alt="Room Photo" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e2e8f0/475569?text=Image+Not+Found';" />
        <p id="photo-desc" class="text-xs text-gray-600 mt-2"></p>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    <div id="loading">Loading Environment & Data...<br><span class="text-sm font-normal text-gray-500">(Note: Must be run on a local web server to fetch JSON data)</span></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#f0f9ff');
        scene.fog = new THREE.FogExp2('#f0f9ff', 0.02);

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 15);

        // Renderer Setup
        const canvasContainer = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        canvasContainer.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(5, 0, 3);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Ground Plane
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: '#84cc16',
            roughness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Raycaster and interaction variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactableObjects = [];

        // Helper function to create blocks
        function createBlock(data, isRoom = false) {
            const geometry = new THREE.BoxGeometry(data.dimensions.w, data.dimensions.h, data.dimensions.d);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color,
                transparent: isRoom,
                opacity: isRoom ? 0.4 : 1.0,
                roughness: 0.7
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.position.x, data.position.y, data.position.z);
            
            if (data.rotation) mesh.rotation.y = data.rotation;

            mesh.castShadow = !isRoom;
            mesh.receiveShadow = true;

            if (isRoom) {
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
                mesh.add(line);
            }

            scene.add(mesh);
        }

        // Helper function to create photo sprites
        function createPhotoMarker(data) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;

            context.fillStyle = 'rgba(255, 255, 255, 0.9)';
            context.beginPath();
            context.roundRect(0, 0, canvas.width, canvas.height, 10);
            context.fill();
            
            context.strokeStyle = '#3b82f6';
            context.lineWidth = 4;
            context.stroke();

            context.fillStyle = '#1e3a8a';
            context.font = 'Bold 40px Inter';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('📷', canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(data.position.x, data.position.y, data.position.z);
            sprite.scale.set(1.5, 0.75, 1);
            sprite.userData = { isPhotoMarker: true, photoData: data };
            
            scene.add(sprite);
            interactableObjects.push(sprite);
        }

        // Load JSON Data
        async function loadData() {
            try {
                // We are embedding the JSON directly here to prevent "Failed to parse URL" fetch errors
                // inside this sandbox environment. 
                // When you move this to your repository, you can switch back to the fetch('data/rooms.json') approach.
                const rooms = [
                    { id: "stue", name: "Living Room", dimensions: { w: 6, h: 2.5, d: 5 }, position: { x: 3, y: 1.25, z: 2.5 }, color: "#e5e7eb", type: "room" },
                    { id: "koekken", name: "Kitchen", dimensions: { w: 4, h: 2.5, d: 3 }, position: { x: 8, y: 1.25, z: 1.5 }, color: "#f3f4f6", type: "room" },
                    { id: "sovevaerelse", name: "Master Bedroom", dimensions: { w: 4, h: 2.5, d: 3 }, position: { x: 8, y: 1.25, z: 4.5 }, color: "#e2e8f0", type: "room" },
                    { id: "terrasse", name: "Wood Deck", dimensions: { w: 10, h: 0.2, d: 3 }, position: { x: 5, y: 0.1, z: 6.5 }, color: "#d97706", type: "outdoor" }
                ];

                const furnishings = [
                    { id: "f1", room_id: "stue", name: "Sofa", dimensions: { w: 2.2, h: 0.8, d: 0.9 }, position: { x: 3, y: 0.4, z: 2.5 }, rotation: 0, color: "#475569" },
                    { id: "f2", room_id: "stue", name: "Spisebord", dimensions: { w: 2, h: 0.75, d: 1 }, position: { x: 1.5, y: 0.375, z: 1.5 }, rotation: 0, color: "#78350f" },
                    { id: "f3", room_id: "sovevaerelse", name: "Dobbeltseng", dimensions: { w: 1.8, h: 0.5, d: 2 }, position: { x: 8, y: 0.25, z: 4.5 }, rotation: 0, color: "#94a3b8" }
                ];

                const appliances = [
                    { id: "a1", room_id: "koekken", name: "Køleskab", dimensions: { w: 0.6, h: 1.8, d: 0.6 }, position: { x: 9.7, y: 0.9, z: 0.3 }, color: "#cbd5e1" },
                    { id: "a2", room_id: "stue", name: "Brændeovn", dimensions: { w: 0.5, h: 1.2, d: 0.5 }, position: { x: 5.5, y: 0.6, z: 0.5 }, color: "#1e293b" }
                ];

                const photos = [
                    { id: "p1", room_id: "sovevaerelse", name: "Annex Bedroom 1", position: { x: 8, y: 1.5, z: 4.5 }, url: "https://placehold.co/400x300/e2e8f0/475569?text=annex+bedroom+1.JPG", desc: "View of the first annex bedroom." },
                    { id: "p2", room_id: "sovevaerelse", name: "Annex Bedroom 2", position: { x: 7, y: 1.5, z: 4.5 }, url: "https://placehold.co/400x300/e2e8f0/475569?text=annex+bedroom+2.JPG", desc: "Alternative view of the annex bedroom." },
                    { id: "p3", room_id: "stue", name: "Dining Room 1", position: { x: 2, y: 1.5, z: 1.5 }, url: "https://placehold.co/400x300/e5e7eb/475569?text=dining-room-1.JPG", desc: "Dining area looking towards the kitchen." },
                    { id: "p4", room_id: "stue", name: "Dining Room 2", position: { x: 1, y: 1.5, z: 1.5 }, url: "https://placehold.co/400x300/e5e7eb/475569?text=dining-room-2.JPG", desc: "Dining area from another angle." },
                    { id: "p5", room_id: "stue", name: "Living Room 1", position: { x: 4, y: 1.5, z: 2.5 }, url: "https://placehold.co/400x300/e5e7eb/475569?text=living-room-1.JPG", desc: "Main living area." },
                    { id: "p6", room_id: "stue", name: "Living Room 2", position: { x: 3, y: 1.5, z: 3.5 }, url: "https://placehold.co/400x300/e5e7eb/475569?text=living-room-2.JPG", desc: "Living area with view of the garden." },
                    { id: "p7", room_id: "stue", name: "Guest Room 1", position: { x: 1, y: 1.5, z: 4 }, url: "https://placehold.co/400x300/e5e7eb/475569?text=guest-room-1.JPG", desc: "First guest room." },
                    { id: "p8", room_id: "stue", name: "Guest Room 2", position: { x: 1, y: 1.5, z: 3 }, url: "https://placehold.co/400x300/e5e7eb/475569?text=guest-room-2.JPG", desc: "Second guest room." },
                    { id: "p9", room_id: "koekken", name: "Kitchen 1", position: { x: 9, y: 1.5, z: 1.5 }, url: "https://placehold.co/400x300/f3f4f6/475569?text=kitchen-1.JPG", desc: "Kitchen view." },
                    { id: "p10", room_id: "koekken", name: "Guest Bathroom", position: { x: 7, y: 1.5, z: 1 }, url: "https://placehold.co/400x300/f3f4f6/475569?text=guest-bathroom.JPG", desc: "Guest bathroom." },
                    { id: "p11", room_id: "sovevaerelse", name: "Annex Bathroom", position: { x: 9, y: 1.5, z: 5.5 }, url: "https://placehold.co/400x300/e2e8f0/475569?text=annex-bathroom.JPG", desc: "Bathroom in the annex." },
                    { id: "p12", room_id: "terrasse", name: "Outdoor Shower", position: { x: 9, y: 1.5, z: 7 }, url: "https://placehold.co/400x300/d97706/ffffff?text=outdoor-shower.JPG", desc: "Outdoor shower area." },
                    { id: "p13", room_id: "terrasse", name: "Hero Exterior", position: { x: 5, y: 3, z: 8 }, url: "https://placehold.co/400x300/84cc16/ffffff?text=hero-exterior.JPG", desc: "Exterior view of the summer house." }
                ];

                // Render objects
                rooms.forEach(room => createBlock(room, true));
                furnishings.forEach(item => createBlock(item, false));
                appliances.forEach(app => createBlock(app, false));
                photos.forEach(photo => createPhotoMarker(photo));

                document.getElementById('data-stats').innerText = 
                    `${rooms.length} Rooms/Areas\n` +
                    `${furnishings.length + appliances.length} Items\n` +
                    `${photos.length} Photos`;
                
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `
                    <span style="color:red">Error Loading Data</span><br>
                    <span class="text-sm">You must run this file via a local web server (e.g. VSCode Live Server, Python http.server) to fetch JSON files.</span>
                `;
            }
        }

        // Interaction Logic
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isPhotoMarker) {
                    showPhotoOverlay(object.userData.photoData);
                }
            }
        }

        function showPhotoOverlay(data) {
            const overlay = document.getElementById('photo-overlay');
            const img = document.getElementById('photo-img');
            const title = document.getElementById('photo-title');
            const desc = document.getElementById('photo-desc');

            title.innerText = data.name;
            img.src = data.url; 
            desc.innerText = data.desc;
            
            overlay.style.display = 'block';
        }

        window.addEventListener('click', onMouseClick, false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize and animate
        loadData();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
