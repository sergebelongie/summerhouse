<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyvelbakken 10 - Digital Twin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #F8F6F0; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #E2DFD7;
            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.05);
            max-width: 320px;
            pointer-events: auto;
            z-index: 10;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: #6B7A74;
            z-index: 20;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #E2DFD7;
        }
        
        #photo-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.98);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E2DFD7;
            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.1);
            max-width: 400px;
            display: none;
            z-index: 30;
            pointer-events: auto;
        }
        #photo-overlay img {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #E2DFD7;
        }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #6B7A74;
            font-size: 1.2rem;
        }
        .close-btn:hover { color: #2C3531; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-panel">
        <h1 class="text-xl font-bold text-[#2C3531] mb-1" style="font-family: 'Playfair Display', serif;">Gyvelbakken 10</h1>
        <p class="text-xs text-[#6B7A74] uppercase tracking-widest font-semibold mb-4">Digital Twin Viewer</p>
        <div class="text-xs text-[#6B7A74] space-y-2 bg-[#F8F6F0] p-3 rounded-lg border border-[#E2DFD7]">
            <p class="font-semibold text-[#2C3531] mb-1">Navigation Controls:</p>
            <ul class="list-disc pl-4 space-y-1">
                <li>Left Click + Drag to Rotate</li>
                <li>Right Click + Drag to Pan</li>
                <li>Scroll to Zoom</li>
                <li>Click 📷 markers to view photos</li>
            </ul>
        </div>
        <div class="mt-4 pt-4 border-t border-[#E2DFD7]">
            <p class="text-xs font-semibold text-[#2C3531]">Model Statistics:</p>
            <p class="text-xs text-[#6B7A74] mt-1" id="data-stats">Fetching JSON data...</p>
        </div>
    </div>

    <div id="photo-overlay">
        <span class="close-btn" onclick="document.getElementById('photo-overlay').style.display='none'">×</span>
        <h3 id="photo-title" class="text-sm font-bold mb-2 text-[#2C3531]">Room Photo</h3>
        <img id="photo-img" src="" alt="Room Photo" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e2e8f0/475569?text=Image+Not+Found';" />
        <p id="photo-desc" class="text-xs text-[#6B7A74] mt-2 leading-relaxed"></p>
    </div>

    <div id="canvas-container"></div>
    <div id="loading">Initializing Digital Twin...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#F8F6F0'); 

        // Camera setup oriented to look at the center of the property (X: 45, Z: 35)
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(45, 60, 110); 

        const canvasContainer = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        canvasContainer.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(45, 0, 35);
        controls.zoomSpeed = 3.0; // Increased for faster pinch/scroll zooming

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(20, 50, 80);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const groundGeometry = new THREE.PlaneGeometry(300, 300);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: '#DCE4D8', roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(45, -0.1, 35);
        ground.receiveShadow = true;
        scene.add(ground);

        function createBlock(data, isRoom = false) {
            const geometry = new THREE.BoxGeometry(data.dimensions.w, data.dimensions.h, data.dimensions.d);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color,
                transparent: isRoom && data.type !== 'outdoor',
                opacity: (isRoom && data.type !== 'outdoor') ? 0.8 : 1.0,
                roughness: 0.8
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.position.x, data.position.y, data.position.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            if (isRoom && data.type !== 'outdoor') {
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
                    color: 0x6B7A74, linewidth: 1, opacity: 0.4, transparent: true
                }));
                mesh.add(line);
            }
            scene.add(mesh);
            return mesh;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactableObjects = [];

        function createPhotoMarker(data) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;

            context.fillStyle = 'rgba(255, 255, 255, 0.95)';
            context.beginPath();
            context.roundRect(0, 0, canvas.width, canvas.height, 12);
            context.fill();
            context.strokeStyle = '#6B7A74'; 
            context.lineWidth = 3;
            context.stroke();

            context.fillStyle = '#2C3531'; 
            context.font = 'Bold 36px Inter';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('📷', canvas.width / 2, canvas.height / 2 + 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(data.position.x, data.position.y, data.position.z);
            sprite.scale.set(3, 1.5, 1);
            sprite.userData = { isPhotoMarker: true, photoData: data };
            
            scene.add(sprite);
            interactableObjects.push(sprite);
        }

        function createCompass() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const cx = 256;
            const cy = 256;

            ctx.clearRect(0, 0, 512, 512);

            ctx.beginPath();
            ctx.arc(cx, cy, 180, 0, 2 * Math.PI);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(107, 122, 116, 0.4)';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy - 180); ctx.lineTo(cx, cy + 180);
            ctx.moveTo(cx - 180, cy); ctx.lineTo(cx + 180, cy);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(107, 122, 116, 0.3)';
            ctx.stroke();

            // Add slight drop shadow to make white pointers pop against the floor
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;

            // North Pointer - Bright Red
            ctx.fillStyle = '#FF2A2A'; 
            ctx.beginPath();
            ctx.moveTo(cx, cy - 160);
            ctx.lineTo(cx + 20, cy - 20);
            ctx.lineTo(cx, cy - 40);
            ctx.lineTo(cx - 20, cy - 20);
            ctx.fill();

            // South Pointer - Clean White
            ctx.fillStyle = '#FFFFFF'; 
            ctx.beginPath();
            ctx.moveTo(cx, cy + 160);
            ctx.lineTo(cx + 20, cy + 20);
            ctx.lineTo(cx, cy + 40);
            ctx.lineTo(cx - 20, cy + 20);
            ctx.fill();

            // East Pointer - Clean White
            ctx.beginPath();
            ctx.moveTo(cx + 160, cy);
            ctx.lineTo(cx + 20, cy + 20);
            ctx.lineTo(cx + 40, cy);
            ctx.lineTo(cx + 20, cy - 20);
            ctx.fill();

            // West Pointer - Clean White
            ctx.beginPath();
            ctx.moveTo(cx - 160, cy);
            ctx.lineTo(cx - 20, cy + 20);
            ctx.lineTo(cx - 40, cy);
            ctx.lineTo(cx - 20, cy - 20);
            ctx.fill();

            // Remove shadow for crisp text
            ctx.shadowColor = 'transparent';

            ctx.font = 'bold 42px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Counter-rotate text so it stays upright
            const textRot = -Math.PI * (168 / 180);
            
            // Draw N in Red, others in White
            ctx.save(); ctx.translate(cx, cy - 210); ctx.rotate(textRot); ctx.fillStyle = '#FF2A2A'; ctx.fillText('N', 0, 0); ctx.restore();
            ctx.save(); ctx.translate(cx, cy + 210); ctx.rotate(textRot); ctx.fillStyle = '#FFFFFF'; ctx.fillText('S', 0, 0); ctx.restore();
            ctx.save(); ctx.translate(cx + 210, cy); ctx.rotate(textRot); ctx.fillStyle = '#FFFFFF'; ctx.fillText('E', 0, 0); ctx.restore();
            ctx.save(); ctx.translate(cx - 210, cy); ctx.rotate(textRot); ctx.fillStyle = '#FFFFFF'; ctx.fillText('W', 0, 0); ctx.restore();

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.8, depthWrite: false });
            const compass = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), material);

            compass.position.set(40, 0.11, 41.5);
            compass.rotation.x = -Math.PI / 2;
            compass.rotation.z = Math.PI * (168 / 180);
            scene.add(compass);
        }

        async function fetchCleanJSON(url) {
            const isPreview = window.location.protocol === 'blob:';
            
            // Use GitHub API in preview to completely bypass CDN caching
            const fetchUrl = isPreview ? 
                `https://api.github.com/repos/sergebelongie/summerhouse/contents/digital-twin/${url}` : 
                `${url}?t=${new Date().getTime()}`;
                
            // The API requires this header to return raw text instead of Base64 encoded blobs
            const headers = isPreview ? { 'Accept': 'application/vnd.github.v3.raw' } : {};
            const res = await fetch(fetchUrl, { headers });
            
            if (!res.ok) throw new Error(`Could not find ${url} (404).`);
            const text = await res.text();
            
            return JSON.parse(text.replace(/\/\*[\s\S]*?\*\//g, ''));
        }

        async function loadData() {
            try {
                const [roomsData, furnishingsData, photosData, appliancesData, architectureData] = await Promise.all([
                    fetchCleanJSON('data/rooms.json'),
                    fetchCleanJSON('data/furnishings.json'),
                    fetchCleanJSON('data/photos.json'),
                    fetchCleanJSON('data/appliances.json'),
                    fetchCleanJSON('data/architecture.json').catch(() => [])
                ]);

                // Build Geometry
                // Flatten rooms into floor slabs (height: 0.1m) so we can see inside
                roomsData.forEach(room => {
                    const floorData = { ...room };
                    floorData.dimensions = { ...room.dimensions, h: 0.1 };
                    floorData.position = { ...room.position, y: 0.05 };
                    createBlock(floorData, true);
                });

                furnishingsData.forEach(item => createBlock(item, false));
                appliancesData.forEach(app => createBlock(app, false));
                architectureData.forEach(wall => createBlock(wall, false));
                photosData.forEach(photo => createPhotoMarker(photo));
                
                createCompass();

                document.getElementById('data-stats').innerText = 
                    `${roomsData.length} Architectural zones\n` +
                    `${photosData.length} Photo Markers mapped`;
                
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error("Initialization Error:", error);
                
                // Advanced Error Reporting Display
                document.getElementById('loading').innerHTML = `
                    <span style="color:#C07A63; font-size: 1.5rem;">Error Loading 3D Data</span><br>
                    <span style="font-size:0.9rem; color:#2C3531; font-family: monospace; background: #fff; padding: 4px; border-radius: 4px; display:inline-block; margin-top: 10px;">
                        ${error.message}
                    </span><br>
                    <span style="font-size:0.8rem; display:block; margin-top: 10px;">Check browser console for full stack trace.</span>`;
            }
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isPhotoMarker) {
                    showPhotoOverlay(object.userData.photoData);
                }
            }
        }

        function showPhotoOverlay(data) {
            const overlay = document.getElementById('photo-overlay');
            const img = document.getElementById('photo-img');
            const title = document.getElementById('photo-title');
            const desc = document.getElementById('photo-desc');

            title.innerText = data.name;
            // The image path relies on standard relative hosting on your site
            img.src = data.url; 
            desc.innerText = data.desc;
            
            overlay.style.display = 'block';
        }

        window.addEventListener('click', onMouseClick, false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Trigger the data load
        loadData();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
