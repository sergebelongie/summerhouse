<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyvelbakken 10 - Digital Twin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f8f6f0; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Panel Styling */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #E2DFD7;
            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.05);
            max-width: 320px;
            pointer-events: auto;
            z-index: 10;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: #6B7A74;
            z-index: 20;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* Photo Overlay Styling */
        #photo-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.98);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E2DFD7;
            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.1);
            max-width: 400px;
            display: none;
            z-index: 30;
            pointer-events: auto;
        }
        #photo-overlay img {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #E2DFD7;
        }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #6B7A74;
            font-size: 1.2rem;
        }
        .close-btn:hover { color: #2C3531; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-panel">
        <h1 class="text-xl font-bold text-[#2C3531] mb-1" style="font-family: 'Playfair Display', serif;">Gyvelbakken 10</h1>
        <p class="text-xs text-[#6B7A74] uppercase tracking-widest font-semibold mb-4">Summer Home 3D</p>
        <div class="text-xs text-[#6B7A74] space-y-2 bg-[#F8F6F0] p-3 rounded-lg border border-[#E2DFD7]">
            <p class="font-semibold text-[#2C3531] mb-1">Navigation Controls:</p>
            <ul class="list-disc pl-4 space-y-1">
                <li>Left Click + Drag to Rotate</li>
                <li>Right Click + Drag to Pan</li>
                <li>Scroll to Zoom</li>
                <li>Click 📷 markers to view photos</li>
            </ul>
        </div>
        <div class="mt-4 pt-4 border-t border-[#E2DFD7]">
            <p class="text-xs font-semibold text-[#2C3531]">Model Statistics:</p>
            <p class="text-xs text-[#6B7A74] mt-1" id="data-stats">Loading modular data via fetch()...</p>
        </div>
    </div>

    <!-- Photo Overlay -->
    <div id="photo-overlay">
        <span class="close-btn" onclick="document.getElementById('photo-overlay').style.display='none'">×</span>
        <h3 id="photo-title" class="text-sm font-bold mb-2 text-[#2C3531]">Room Photo</h3>
        <img id="photo-img" src="" alt="Room Photo" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e2e8f0/475569?text=Image+Not+Found';" />
        <p id="photo-desc" class="text-xs text-[#6B7A74] mt-2 leading-relaxed"></p>
    </div>

    <div id="canvas-container"></div>
    <div id="loading">Initializing Digital Twin...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#F8F6F0'); 
        scene.fog = new THREE.FogExp2('#F8F6F0', 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 45); 

        const canvasContainer = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        canvasContainer.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(15, 30, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: '#DCE4D8', roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);

        function createBlock(data, isRoom = false) {
            const geometry = new THREE.BoxGeometry(data.dimensions.w, data.dimensions.h, data.dimensions.d);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color,
                transparent: isRoom && data.type !== 'outdoor',
                opacity: (isRoom && data.type !== 'outdoor') ? 0.7 : 1.0,
                roughness: 0.8
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.position.x, data.position.y, data.position.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            if (isRoom) {
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
                    color: 0x6B7A74, linewidth: 1, opacity: 0.5, transparent: true
                }));
                mesh.add(line);
            }
            scene.add(mesh);
            return mesh;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactableObjects = [];

        function createPhotoMarker(data) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;

            context.fillStyle = 'rgba(255, 255, 255, 0.95)';
            context.beginPath();
            context.roundRect(0, 0, canvas.width, canvas.height, 12);
            context.fill();
            context.strokeStyle = '#6B7A74'; 
            context.lineWidth = 3;
            context.stroke();

            context.fillStyle = '#2C3531'; 
            context.font = 'Bold 36px Inter';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('📷', canvas.width / 2, canvas.height / 2 + 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(data.position.x, data.position.y + 1, data.position.z);
            sprite.scale.set(2, 1, 1);
            sprite.userData = { isPhotoMarker: true, photoData: data };
            scene.add(sprite);
            interactableObjects.push(sprite);
        }

        async function loadData() {
            try {
                // Fetching from the separate JSON files to maintain clean architecture
                const [roomsRes, furnishingsRes, photosRes, appliancesRes] = await Promise.all([
                    fetch('data/rooms.json'),
                    fetch('data/furnishings.json'),
                    fetch('data/photos.json'),
                    fetch('data/appliances.json').catch(() => ({ json: () => [] })) // Failsafe if not created yet
                ]);

                if (!roomsRes.ok) throw new Error("Could not fetch rooms.json");

                const roomsData = await roomsRes.json();
                const furnishingsData = await furnishingsRes.json();
                const photosData = await photosRes.json();
                const appliancesData = await appliancesRes.json();

                // Render objects based on JSON payloads
                roomsData.forEach(room => createBlock(room, true));
                furnishingsData.forEach(item => createBlock(item, false));
                appliancesData.forEach(app => createBlock(app, false));
                photosData.forEach(photo => createPhotoMarker(photo));

                document.getElementById('data-stats').innerText = 
                    `${roomsData.length} Rooms/Zones\n` +
                    `${furnishingsData.length + appliancesData.length} Details\n` +
                    `${photosData.length} Photo Markers mapped`;
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('loading').innerHTML = `
                    <span style="color:#C07A63">Sandbox CORS restriction detected.</span><br>
                    <span style="font-size:0.8rem">This code will work correctly on your GitHub Pages repo!</span>`;
            }
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isPhotoMarker) {
                    showPhotoOverlay(object.userData.photoData);
                }
            }
        }

        function showPhotoOverlay(data) {
            const overlay = document.getElementById('photo-overlay');
            const img = document.getElementById('photo-img');
            const title = document.getElementById('photo-title');
            const desc = document.getElementById('photo-desc');

            title.innerText = data.name;
            img.src = data.url; 
            desc.innerText = data.desc;
            
            overlay.style.display = 'block';
        }

        window.addEventListener('click', onMouseClick, false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadData();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
