<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyvelbakken 10 - Digital Twin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f8f6f0; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #E2DFD7;
            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.05);
            max-width: 320px;
            pointer-events: auto;
            z-index: 10;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: #6B7A74;
            z-index: 20;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        #photo-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.98);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E2DFD7;
            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.1);
            max-width: 400px;
            display: none;
            z-index: 30;
            pointer-events: auto;
        }
        #photo-overlay img {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #E2DFD7;
        }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #6B7A74;
            font-size: 1.2rem;
        }
        .close-btn:hover { color: #2C3531; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-panel">
        <h1 class="text-xl font-bold text-[#2C3531] mb-1" style="font-family: 'Playfair Display', serif;">Gyvelbakken 10</h1>
        <p class="text-xs text-[#6B7A74] uppercase tracking-widest font-semibold mb-4">Summer Home 3D</p>
        <div class="text-xs text-[#6B7A74] space-y-2 bg-[#F8F6F0] p-3 rounded-lg border border-[#E2DFD7]">
            <p class="font-semibold text-[#2C3531] mb-1">Navigation Controls:</p>
            <ul class="list-disc pl-4 space-y-1">
                <li>Left Click + Drag to Rotate</li>
                <li>Right Click + Drag to Pan</li>
                <li>Scroll to Zoom</li>
                <li>Click 📷 markers to view photos</li>
            </ul>
        </div>
        <div class="mt-4 pt-4 border-t border-[#E2DFD7]">
            <p class="text-xs font-semibold text-[#2C3531]">Model Statistics:</p>
            <p class="text-xs text-[#6B7A74] mt-1" id="data-stats">Loading mapping data...</p>
        </div>
    </div>

    <div id="photo-overlay">
        <span class="close-btn" onclick="document.getElementById('photo-overlay').style.display='none'">×</span>
        <h3 id="photo-title" class="text-sm font-bold mb-2 text-[#2C3531]">Room Photo</h3>
        <img id="photo-img" src="" alt="Room Photo" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e2e8f0/475569?text=Image+Not+Found';" />
        <p id="photo-desc" class="text-xs text-[#6B7A74] mt-2 leading-relaxed"></p>
    </div>

    <div id="canvas-container"></div>
    <div id="loading">Initializing Digital Twin...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- ACCURATE EMBEDDED LAYOUT DATA ---
        // Extracted and mapped from property_layout_diagram.html
        
        const roomsData = [
            // ANNEX
            { id: "annex_firewood", name: "Firewood", dimensions: { w: 3.5, h: 2.5, d: 1.5 }, position: { x: -10.25, y: 1.25, z: -13.75 }, color: "#E6E4DF", type: "room" },
            { id: "annex_shower", name: "Outdoor Shower", dimensions: { w: 3.5, h: 2.5, d: 1.5 }, position: { x: -6.75, y: 1.25, z: -13.75 }, color: "#DDE5EC", type: "room" },
            { id: "annex_room1", name: "Annex Bed 1", dimensions: { w: 7.0, h: 2.5, d: 3.25 }, position: { x: -8.5, y: 1.25, z: -11.375 }, color: "#DCE4D8", type: "room" },
            { id: "annex_bad", name: "Annex Bath", dimensions: { w: 3.75, h: 2.5, d: 2.25 }, position: { x: -10.125, y: 1.25, z: -8.625 }, color: "#DDE5EC", type: "room" },
            { id: "annex_entrance", name: "Annex Entry", dimensions: { w: 3.25, h: 2.5, d: 2.25 }, position: { x: -6.625, y: 1.25, z: -8.625 }, color: "#E8D0C5", type: "room" },
            { id: "annex_room2", name: "Annex Bed 2", dimensions: { w: 7.0, h: 2.5, d: 3.25 }, position: { x: -8.5, y: 1.25, z: -5.875 }, color: "#DCE4D8", type: "room" },
            { id: "annex_vask", name: "Laundry", dimensions: { w: 3.5, h: 2.5, d: 2.75 }, position: { x: -10.25, y: 1.25, z: -2.875 }, color: "#E6E4DF", type: "room" },
            { id: "annex_skur", name: "Shed", dimensions: { w: 3.5, h: 2.5, d: 2.75 }, position: { x: -6.75, y: 1.25, z: -2.875 }, color: "#E6E4DF", type: "room" },
            
            // MAIN HOUSE WING 1 (Beds/Baths)
            { id: "main_master_bath", name: "Master Bath", dimensions: { w: 5.0, h: 2.5, d: 3.5 }, position: { x: 6.0, y: 1.25, z: -7.25 }, color: "#DDE5EC", type: "room" },
            { id: "main_skur", name: "Main Shed", dimensions: { w: 3.5, h: 2.5, d: 3.5 }, position: { x: 10.25, y: 1.25, z: -7.25 }, color: "#E6E4DF", type: "room" },
            { id: "main_master_bed", name: "Master Bed", dimensions: { w: 5.5, h: 2.5, d: 4.25 }, position: { x: 6.25, y: 1.25, z: -3.375 }, color: "#DCE4D8", type: "room" },
            { id: "main_garderobe", name: "Wardrobe", dimensions: { w: 3.0, h: 2.5, d: 4.25 }, position: { x: 10.5, y: 1.25, z: -3.375 }, color: "#E6E4DF", type: "room" },
            { id: "main_hallway", name: "Hallway", dimensions: { w: 3.5, h: 2.5, d: 8.25 }, position: { x: 5.25, y: 1.25, z: 2.875 }, color: "#F0ECE1", type: "room" },
            { id: "main_bed2", name: "Guest Bed 1", dimensions: { w: 5.0, h: 2.5, d: 4.125 }, position: { x: 9.5, y: 1.25, z: 0.8125 }, color: "#DCE4D8", type: "room" },
            { id: "main_bed3", name: "Guest Bed 2", dimensions: { w: 5.0, h: 2.5, d: 4.9375 }, position: { x: 9.5, y: 1.25, z: 5.375 }, color: "#DCE4D8", type: "room" },
            
            // MAIN HOUSE WING 2 (Living/Entry)
            { id: "main_stue", name: "Living Room", dimensions: { w: 10.0, h: 2.5, d: 11.0 }, position: { x: -7.0, y: 1.25, z: 12.5 }, color: "#E8D8C4", type: "room" },
            { id: "main_kokken", name: "Kitchen & Dining", dimensions: { w: 9.0, h: 2.5, d: 11.0 }, position: { x: 2.5, y: 1.25, z: 12.5 }, color: "#EFE6D5", type: "room" },
            { id: "main_viktualie", name: "Pantry", dimensions: { w: 2.5, h: 2.5, d: 2.25 }, position: { x: 10.75, y: 1.25, z: 8.125 }, color: "#E6E4DF", type: "room" },
            { id: "main_wc", name: "Guest WC", dimensions: { w: 2.5, h: 2.5, d: 4.25 }, position: { x: 10.75, y: 1.25, z: 11.375 }, color: "#DDE5EC", type: "room" },
            { id: "main_entre", name: "Entrance", dimensions: { w: 5.0, h: 2.5, d: 4.5 }, position: { x: 9.5, y: 1.25, z: 15.75 }, color: "#E8D0C5", type: "room" },

            // TERRACES
            { id: "covered_terrace", name: "Covered Terrace", dimensions: { w: 7.0, h: 0.1, d: 8.5 }, position: { x: -8.5, y: 0.05, z: 2.75 }, color: "#ECE1D2", type: "outdoor" },
            { id: "courtyard_terrace", name: "Courtyard Terrace", dimensions: { w: 10.0, h: 0.1, d: 8.5 }, position: { x: 0.0, y: 0.05, z: 2.75 }, color: "#ECE1D2", type: "outdoor" }
        ];

        const furnishingsData = [
            { id: "f1", room_id: "main_stue", name: "Sofa", dimensions: { w: 2.5, h: 0.8, d: 2.5 }, position: { x: -7.0, y: 0.4, z: 12.5 }, color: "#475569" },
            { id: "f2", room_id: "main_kokken", name: "Dining Table", dimensions: { w: 3.5, h: 0.75, d: 1.5 }, position: { x: 2.5, y: 0.375, z: 12.5 }, color: "#78350f" },
            { id: "f3", room_id: "main_master_bed", name: "Master Bed", dimensions: { w: 2, h: 0.5, d: 2 }, position: { x: 6.25, y: 0.25, z: -3.375 }, color: "#94a3b8" }
        ];

        const appliancesData = []; // Can be repopulated later

        const photosData = [
            { id: "p1", room_id: "annex_room1", name: "Annex Bedroom 1", position: { x: -8.5, y: 1.25, z: -11.375 }, url: "../assets/images/annex bedroom 1.JPG", desc: "View of the first annex bedroom." },
            { id: "p2", room_id: "annex_room2", name: "Annex Bedroom 2", position: { x: -8.5, y: 1.25, z: -5.875 }, url: "../assets/images/annex bedroom 2.JPG", desc: "Alternative view of the annex bedroom." },
            { id: "p3", room_id: "main_kokken", name: "Dining Room 1", position: { x: 1.0, y: 1.25, z: 11.0 }, url: "../assets/images/dining-room-1.JPG", desc: "Dining area looking towards the kitchen." },
            { id: "p4", room_id: "main_kokken", name: "Dining Room 2", position: { x: 3.0, y: 1.25, z: 13.0 }, url: "../assets/images/dining-room-2.JPG", desc: "Dining area from another angle." },
            { id: "p5", room_id: "main_stue", name: "Living Room 1", position: { x: -5.0, y: 1.25, z: 12.0 }, url: "../assets/images/living-room-1.JPG", desc: "Main living area." },
            { id: "p6", room_id: "main_stue", name: "Living Room 2", position: { x: -8.0, y: 1.25, z: 13.0 }, url: "../assets/images/living-room-2.JPG", desc: "Living area with view of the garden." },
            { id: "p7", room_id: "main_bed2", name: "Guest Room 1", position: { x: 9.5, y: 1.25, z: 0.8 }, url: "../assets/images/guest-room-1.JPG", desc: "First guest room in the main house." },
            { id: "p8", room_id: "main_bed3", name: "Guest Room 2", position: { x: 9.5, y: 1.25, z: 5.3 }, url: "../assets/images/guest-room-2.JPG", desc: "Second guest room in the main house." },
            { id: "p9", room_id: "main_kokken", name: "Kitchen 1", position: { x: 3.0, y: 1.25, z: 11.0 }, url: "../assets/images/kitchen-1.JPG", desc: "Kitchen view." },
            { id: "p10", room_id: "main_wc", name: "Guest Bathroom", position: { x: 10.75, y: 1.25, z: 11.375 }, url: "../assets/images/guest-bathroom.JPG", desc: "Guest bathroom." },
            { id: "p11", room_id: "annex_bad", name: "Annex Bathroom", position: { x: -10.125, y: 1.25, z: -8.625 }, url: "../assets/images/annex-bathroom.JPG", desc: "Bathroom in the annex." },
            { id: "p12", room_id: "annex_shower", name: "Outdoor Shower", position: { x: -6.75, y: 1.25, z: -13.75 }, url: "../assets/images/outdoor-shower.JPG", desc: "Outdoor shower area." },
            { id: "p13", room_id: "exterior", name: "Hero Exterior", position: { x: -2.0, y: 4.0, z: 25.0 }, url: "../assets/images/hero-exterior.JPG", desc: "Exterior view of the summer house." }
        ];

        // --- END EMBEDDED DATA ---

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#F8F6F0'); // Match Nordic background
        scene.fog = new THREE.FogExp2('#F8F6F0', 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 45); // Start with a wide view

        const canvasContainer = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        canvasContainer.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(15, 30, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);

        // Ground Plane (Lawn)
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: '#DCE4D8', // Light sage for grass to blend with theme
            roughness: 0.9 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);

        function createBlock(data, isRoom = false) {
            const geometry = new THREE.BoxGeometry(data.dimensions.w, data.dimensions.h, data.dimensions.d);
            
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color,
                transparent: isRoom && data.type !== 'outdoor',
                opacity: (isRoom && data.type !== 'outdoor') ? 0.7 : 1.0,
                roughness: 0.8
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.position.x, data.position.y, data.position.z);
            
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Add wireframe edges for definition
            if (isRoom) {
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
                    color: 0x6B7A74, // Nordic muted border
                    linewidth: 1,
                    opacity: 0.5,
                    transparent: true
                }));
                mesh.add(line);
            }

            scene.add(mesh);
            return mesh;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactableObjects = [];

        function createPhotoMarker(data) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;

            context.fillStyle = 'rgba(255, 255, 255, 0.95)';
            context.beginPath();
            context.roundRect(0, 0, canvas.width, canvas.height, 12);
            context.fill();
            
            context.strokeStyle = '#6B7A74'; // Nordic muted
            context.lineWidth = 3;
            context.stroke();

            context.fillStyle = '#2C3531'; // Nordic text
            context.font = 'Bold 36px Inter';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('📷', canvas.width / 2, canvas.height / 2 + 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(data.position.x, data.position.y + 1, data.position.z);
            sprite.scale.set(2, 1, 1);
            
            sprite.userData = { isPhotoMarker: true, photoData: data };
            scene.add(sprite);
            interactableObjects.push(sprite);
        }

        async function loadData() {
            try {
                roomsData.forEach(room => createBlock(room, true));
                furnishingsData.forEach(item => createBlock(item, false));
                photosData.forEach(photo => createPhotoMarker(photo));

                document.getElementById('data-stats').innerText = 
                    `${roomsData.length} Structural Blocks\n` +
                    `${photosData.length} Photo Markers Mapped`;
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `<span style="color:red">Error Loading Data</span>`;
            }
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isPhotoMarker) {
                    showPhotoOverlay(object.userData.photoData);
                }
            }
        }

        function showPhotoOverlay(data) {
            const overlay = document.getElementById('photo-overlay');
            const img = document.getElementById('photo-img');
            const title = document.getElementById('photo-title');
            const desc = document.getElementById('photo-desc');

            title.innerText = data.name;
            // Uses actual repo path; falls back to placeholder on error via the HTML element
            img.src = data.url; 
            desc.innerText = data.desc;
            
            overlay.style.display = 'block';
        }

        window.addEventListener('click', onMouseClick, false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadData();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
