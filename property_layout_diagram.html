    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nordic: {
                            bg: '#F8F6F0',
                            card: '#FFFFFF',

                            muted: '#6B7A74',
                            border: '#E2DFD7',

            box-shadow: 0 10px 30px -5px rgba(44, 53, 49, 0.05), 0 4px 12px -2px rgba(44, 53, 49, 0.03);
        }

        /* Smooth Canvas Transitions */
        #svg-viewport {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F8F6F0;
        }
        ::-webkit-scrollbar-thumb {

            border-radius: 3px;
        }

                        <polygon points="50,5 75,50 50,50" fill="#C62828" />

                </div>
            </div>

            <!-- Top Right: Toggles & Zoom -->

                        <span class="text-[11px] md:text-xs font-medium text-nordic-text group-hover:text-nordic-sageDark transition"><i class="fa-solid fa-couch w-4 text-nordic-muted"></i> Furniture</span>
                        <input type="checkbox" id="toggle-furniture" checked onchange="renderSVG()" class="rounded text-nordic-sageDark focus:ring-nordic-sageDark w-3.5 h-3.5 border-gray-300">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-[11px] md:text-xs font-medium text-nordic-text group-hover:text-nordic-sageDark transition"><i class="fa-solid fa-tag w-4 text-nordic-muted"></i> Labels</span>
                        <input type="checkbox" id="toggle-labels" checked onchange="renderSVG()" class="rounded text-nordic-sageDark focus:ring-nordic-sageDark w-3.5 h-3.5 border-gray-300">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-[11px] md:text-xs font-medium text-nordic-text group-hover:text-nordic-sageDark transition"><i class="fa-solid fa-ruler-combined w-4 text-nordic-muted"></i> Dimensions</span>

                    </label>

                <!-- Zoom Controls -->

                    <button onclick="zoomIn()" class="w-9 h-9 flex items-center justify-center hover:bg-nordic-bg text-nordic-text transition border-b border-nordic-border" title="Zoom In">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </button>
                    <button onclick="zoomOut()" class="w-9 h-9 flex items-center justify-center hover:bg-nordic-bg text-nordic-text transition border-b border-nordic-border" title="Zoom Out">
                        <i class="fa-solid fa-minus text-sm"></i>
                    </button>
                    <button onclick="resetZoom()" class="w-9 h-9 flex items-center justify-center hover:bg-nordic-bg text-nordic-text transition" title="Center Diagram">
                        <i class="fa-solid fa-expand text-sm"></i>

            html += `<rect x="550" y="335" width="70" height="165" fill="#F0ECE1" />`;
            // Exterior wall boundary line between hallway and terrace
            html += `<line x1="550" y1="335" x2="550" y2="500" stroke="#343E38" stroke-width="1.5" />`;
            if (showLabels) html += `<text x="585" y="417" font-size="9" fill="#928A7D" text-anchor="middle" transform="rotate(-90 585,417)">Hallway</text>`;
            
            html += renderRoomSvg('main_bed2', 620, 335, 100, 82.5, showFurniture, showLabels, showDimensions);
            html += renderRoomSvg('main_bed3', 620, 417.5, 100, 82.5, showFurniture, showLabels, showDimensions);
            html += renderRoomSvg('main_stue', 240, 500, 200, 220, showFurniture, showLabels, showDimensions);
            html += renderRoomSvg('main_kokken', 440, 500, 180, 220, showFurniture, showLabels, showDimensions);
            
            // Kitchen extension to visually include the space left of Pantry and WC
            html += `<rect x="619" y="500.75" width="52" height="128.5" fill="#EFE6D5" stroke="none" />`;
            html += `<line x1="620" y1="500" x2="670" y2="500" stroke="#CBB499" stroke-width="1.5" />`;
            
            html += renderRoomSvg('main_entre', 620, 630, 100, 90, showFurniture, showLabels, showDimensions);
            html += renderRoomSvg('main_wc', 670, 545, 50, 85, showFurniture, showLabels, showDimensions);
            html += renderRoomSvg('main_viktualie', 670, 500, 50, 45, showFurniture, showLabels, showDimensions);
            html += `</g>`;

            viewport.innerHTML = html;
        }

        function renderRoomSvg(id, x, y, w, h, showFurniture, showLabels, showDimensions) {
            const room = roomsData[id];
            if (!room) return '';

            let g = `<g>`;

            // Draw Block
            g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${room.fill}" stroke="#6B7A74" stroke-width="1.5" />`;

            // Furniture Details
            if (showFurniture) {
                if (id === 'main_stue') {
                    g += `                          <!-- Fireplace in top right corner -->
                          <rect x="${x + w - 30}" y="${y}" width="30" height="55" fill="#E6E4DF" stroke="#A09D96" stroke-width="1.5" />
                          <text x="${x + w - 15}" y="${y + 27.5}" font-size="9" fill="#928A7D" text-anchor="middle" pointer-events="none" transform="rotate(-90 ${x + w - 15},${y + 27.5})">Fireplace</text>
                          
                          <!-- TV along top wall -->
                          <rect x="${x + w/2 - 40}" y="${y + 5}" width="80" height="8" rx="2" fill="#1A1F1C" />
                          
                          <!-- Seating Area -->
                          <!-- Left Sofa -->
                          <rect x="${x + w/2 - 60}" y="${y + 40}" width="35" height="90" rx="6" fill="#D4C4B0" stroke="#B0A08B"/>
                          <rect x="${x + w/2 - 55}" y="${y + 45}" width="25" height="80" rx="4" fill="#E8D8C4"/>
                          
                          <!-- Right Sofa -->
                          <rect x="${x + w/2 + 25}" y="${y + 40}" width="35" height="90" rx="6" fill="#D4C4B0" stroke="#B0A08B"/>
                          <rect x="${x + w/2 + 30}" y="${y + 45}" width="25" height="80" rx="4" fill="#E8D8C4"/>
                          
                          <!-- Easy Chair -->
                          <rect x="${x + w/2 - 20}" y="${y + 120}" width="40" height="35" rx="8" fill="#D4C4B0" stroke="#B0A08B"/>
                          <rect x="${x + w/2 - 15}" y="${y + 125}" width="30" height="25" rx="6" fill="#E8D8C4"/>
                          
                          <!-- Coffee Table -->
                          <rect x="${x + w/2 - 20}" y="${y + 60}" width="40" height="50" rx="4" fill="#EFE6D5" stroke="#CBB499" stroke-width="1.5"/>`;
                } else if (id === 'main_kokken') {
                    g += `<!-- Dining Table (Center) -->
                          <rect x="${x + 35}" y="${y + 25}" width="110" height="55" rx="6" fill="#CBB499"/>
                          <!-- Top chairs -->
                          <rect x="${x + 45}" y="${y + 13}" width="20" height="8" rx="2" fill="#8C7A6B"/>
                          <rect x="${x + 80}" y="${y + 13}" width="20" height="8" rx="2" fill="#8C7A6B"/>
                          <rect x="${x + 115}" y="${y + 13}" width="20" height="8" rx="2" fill="#8C7A6B"/>
                          <!-- Bottom chairs -->
                          <rect x="${x + 45}" y="${y + 84}" width="20" height="8" rx="2" fill="#8C7A6B"/>
                          <rect x="${x + 80}" y="${y + 84}" width="20" height="8" rx="2" fill="#8C7A6B"/>
                          <rect x="${x + 115}" y="${y + 84}" width="20" height="8" rx="2" fill="#8C7A6B"/>
                          <!-- End chairs -->
                          <rect x="${x + 23}" y="${y + 42}" width="8" height="20" rx="2" fill="#8C7A6B"/>
                          <rect x="${x + 149}" y="${y + 42}" width="8" height="20" rx="2" fill="#8C7A6B"/>
                          
                          <!-- Kitchen Counter (Bottom Edge) -->
                          <rect x="${x + 30}" y="${y + 175}" width="120" height="45" rx="4" fill="#FFFFFF" stroke="#CBB499" stroke-width="1.5"/>
                          <circle cx="${x + 50}" cy="${y + 197}" r="6" fill="#343E38"/><circle cx="${x + 70}" cy="${y + 197}" r="6" fill="#343E38"/>`;
                } else if (id === 'main_master_bed') {
                    // Bed rotated 90 degrees clockwise (head pointing right)
                    g += `<rect x="${x + 45}" y="${y + 7.5}" width="55" height="70" rx="4" fill="#FFFFFF" stroke="#7A8F78" stroke-width="1.5"/>
                          <rect x="${x + 80}" y="${y + 13}" width="15" height="28" rx="2" fill="#DCE4D8"/>
                          <rect x="${x + 80}" y="${y + 44}" width="15" height="28" rx="2" fill="#DCE4D8"/>`;
                } else if (id === 'main_bed2' || id === 'main_bed3') {
                    // Bed rotated 90 degrees clockwise (head pointing right)
                    g += `<rect x="${x + 40}" y="${y + 14}" width="50" height="55" rx="4" fill="#FFFFFF" stroke="#7A8F78" stroke-width="1.5"/>
                          <rect x="${x + 72}" y="${y + 19}" width="14" height="20" rx="2" fill="#DCE4D8"/>
                          <rect x="${x + 72}" y="${y + 44}" width="14" height="20" rx="2" fill="#DCE4D8"/>`;
                } else if (id === 'annex_room1' || id === 'annex_room2') {
                    g += `<rect x="${x + 15}" y="${y + 10}" width="50" height="45" rx="4" fill="#FFFFFF" stroke="#7A8F78" stroke-width="1.5"/>
                          <rect x="${x + 18}" y="${y + 13}" width="20" height="12" rx="2" fill="#DCE4D8"/><rect x="${x + 41}" y="${y + 13}" width="20" height="12" rx="2" fill="#DCE4D8"/>`;
                }
            }

            // Labels
            if (showLabels) {
                const labelY = y + h/2 - (showDimensions ? 6 : 0);
                g += `<text x="${x + w/2}" y="${labelY}" font-size="11" font-weight="600" fill="#343E38" text-anchor="middle" pointer-events="none">${room.name}</text>`;
            }

            if (showDimensions) {
                const dimY = y + h/2 + (showLabels ? 10 : 0);
                g += `<text x="${x + w/2}" y="${dimY}" font-size="9" font-weight="500" fill="#6B7A74" text-anchor="middle" pointer-events="none">${room.area}</text>`;
            }

            g += `</g>`;
            return g;
        }

        function applyTransform() {
            document.getElementById('svg-viewport').style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function zoomIn() { scale = Math.min(scale * 1.25, 4); applyTransform(); }
        function zoomOut() { scale = Math.max(scale / 1.25, 0.75); applyTransform(); }
        function resetZoom() { 
            scale = 1; 
            translateX = 0; 
            translateY = 0; 
            applyTransform(); 
        }

        const container = document.getElementById('canvas-container');

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            }
        });
        
        container.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                applyTransform();
            }
        });
        
        container.addEventListener('touchend', () => { isDragging = false; });
        
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = Math.min(Math.max(scale * (e.deltaY < 0 ? 1.1 : 0.9), 0.75), 4);
            applyTransform();
        }, { passive: false });

        window.onload = function() {
            renderSVG();
            applyTransform();
        };
    </script>
</body>
</html>
