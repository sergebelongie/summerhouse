<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyvelbakken 10 - 3D Model</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; pointer-events: none; z-index: 10; }
        h3 { margin: 0 0 10px 0; color: #fffce0; }
        p { margin: 5px 0; font-size: 14px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.5); font-size: 24px; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Gyvelbakken 10</h3>
        <p>Click anywhere to explore. Press ESC to release.</p>
        <p><b>WASD:</b> Move | <b>Space:</b> Fly Up | <b>Shift:</b> Fly Down</p>
        <p><b>1:</b> Architecture | <b>2:</b> Fixtures | <b>3:</b> Furnishings | <b>4:</b> Grid | <b>5:</b> Openings</p>
    </div>
    <div id="crosshair">+</div>
    
    <!-- Load our Three.js engine -->
    <script type="module" src="/main.js"></script>
</body>
</html>
